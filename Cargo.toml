[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
repository = "https://github.com/Olmer1st/StreamScope"

[workspace.dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "test-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
